<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#04110f" />
    <title>Haunted Suit AR</title>
    <link rel="preload" as="image" href="/loading.jpg" />
    <script>
      // Start EVERY big download right now, in parallel, before the app's JS has even
      // arrived (~16 MB in total, so waiting for the JS first costs seconds on a phone).
      // The app's own fetch()es then pick up these responses. Keep in sync with:
      // tracking/mediapipe-pose.ts (wasm + model), rig/profiles.ts (suits),
      // identity/face-engine.ts (face models), main.ts (wearer.json, suit pick).
      (function () {
        var q = new URLSearchParams(location.search);
        var add = function (href, as) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = as;
          l.href = href;
          l.crossOrigin = 'anonymous';
          document.head.appendChild(l);
        };
        // Same SIMD probe as MediaPipe, so we fetch the wasm build it will ask for.
        var simd = false;
        try {
          simd = WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]));
        } catch (e) {}
        var wasm = '/mediapipe/wasm/vision_wasm' + (simd ? '' : '_nosimd') + '_internal';
        add(wasm + '.wasm', 'fetch');
        add(wasm + '.js', 'script');
        add('/models/pose_landmarker_' + (q.get('model') === 'full' ? 'full' : 'lite') + '.task', 'fetch');
        // The costume is picked here (50/50, or ?suit=) so its download starts now too.
        var suits = ['mermaid', 'bonnie'];
        var suit = suits.indexOf(q.get('suit')) >= 0 ? q.get('suit') : suits[Math.random() < 0.5 ? 0 : 1];
        document.documentElement.setAttribute('data-suit', suit);
        add('/suits/' + suit + '.glb', 'fetch');
        if (q.get('lock') !== '0') {
          add('/face/wearer.json', 'fetch');
          ['tiny_face_detector_model', 'face_landmark_68_tiny_model', 'face_recognition_model'].forEach(function (n) {
            add('/models/face/' + n + '-weights_manifest.json', 'fetch');
            add('/models/face/' + n + '.bin', 'fetch');
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="stage">
      <video id="camera" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>

    <div id="pill" role="status" aria-live="polite" hidden></div>
    <p id="ar-credit" class="ar-credit" hidden></p>

    <!-- Loading screen: starts immediately, no tap needed (see src/ui/loader.ts). -->
    <div id="loader" class="loader">
      <div class="loader-image"></div>
      <canvas id="loader-noise" class="loader-noise" width="160" height="90"></canvas>
      <div class="loader-scanlines"></div>
      <div class="loader-tracking"></div>
      <div class="loader-vignette"></div>
      <div class="loader-content">
        <p id="loader-title" class="loader-title" data-text="It's coming">It's coming</p>
        <div class="loader-bar" aria-hidden="true"><div id="loader-fill" class="loader-fill"></div></div>
        <p id="loader-status" class="loader-status" role="status" aria-live="polite">Waking the dead… 0%</p>
        <button id="retry-btn" class="retry-btn" type="button" hidden>Allow camera</button>
      </div>
      <p id="loader-credit" class="credit"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
